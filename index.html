<script>
// SCROLL ANIMATION
const observer = new IntersectionObserver((e)=>{e.forEach(entry=>{if(entry.isIntersecting)entry.target.classList.add('ativado')})},{threshold:.2});
document.querySelectorAll('.scroll-bottom').forEach(el=>observer.observe(el));

// CUSTOM CURSOR
if(window.innerWidth>=600){
let mx=0,my=0,ix=0,iy=0,ox=0,oy=0;
document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY});
setInterval(()=>{ix+=(mx-ix)*.25;iy+=(my-iy)*.25;ox+=(mx-ox)*.15;oy+=(my-oy)*.15;
document.querySelector('.cursor-inner').style.transform=`translate(${ix}px,${iy}px)`;
document.querySelector('.cursor-outer').style.transform=`translate(${ox}px,${oy}px)`;},16);
}

// SMOOTH SCROLL LENIS
const lenis=new Lenis({duration:1.2});
function raf(t){lenis.raf(t);requestAnimationFrame(raf)}
requestAnimationFrame(raf);

// FAQ TOGGLE
document.querySelectorAll('.faq-question').forEach(q=>{q.onclick=()=>{q.closest('.faq-item').classList.toggle('active')}});
</script>
